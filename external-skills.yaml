# External skills manifest
#
# Machine-readable record of the third-party skills installed dynamically
# through `npx skills` (see docs/migration-npx.md for the install procedure).
#
# This catalogue's own validators and size limits cover only the 15 skills
# maintained in this repository. This file makes the 20 external skills, and
# their upstream provenance, explicit and auditable so that upstream changes
# remain visible instead of arriving silently.
#
# Fields per entry:
#   - source:       upstream repository (owner/repo)
#   - selection:    exact skill directory/name installed from that source
#   - agents:       target agent stores (claude-code, codex, opencode, cursor)
#   - verified_commit: upstream commit reviewed at last verification (fill in;
#                      leave null while following the moving default branch)
#   - verified_at:  ISO-8601 date of the last review (fill in with each check)
#   - claude_code_only: true when the skill uses tools/flows specific to Claude
#                       Code and may need adaptation on other clients
#   - notes:        known compatibility constraints or limitations

sources:
  - name: mattpocock/skills
    # upstream := https://github.com/mattpocock/skills
    selection: [
        setup-matt-pocock-skills,
        grilling,
        domain-modeling,
        grill-with-docs,
        to-spec,
        to-tickets,
        triage,
        tdd,
        diagnosing-bugs,
        code-review,
        codebase-design,
        improve-codebase-architecture,
        writing-for-agents,
        handoff,
        wait-what,
      ]
    agents: [claude-code, codex, opencode, cursor]
    verified_commit: 84fdeffd12f2ee307994d1eb6feb48173b6e0502
    verified_at: "2026-08-08"
    claude_code_only: false
    notes: "code-review uses general-purpose subagents; improve-codebase-architecture expects an Explore-type agent - verify on non-Claude clients."

  - name: obra/superpowers
    selection: [
        dispatching-parallel-agents,
        receiving-code-review,
        verification-before-completion,
        finishing-a-development-branch,
      ]
    agents: [claude-code, codex, opencode, cursor]
    verified_commit: 44c9b2d6e889982ac18c27d05a19fefe335194e1
    verified_at: "2026-08-08"
    claude_code_only: false
    notes: ""

  - name: ksimback/tech-debt-skill
    selection: [tech-debt-audit]
    agents: [claude-code]
    verified_commit: 5a15c1ca4a929b2759461c218478de391a8bda0f
    verified_at: "2026-08-08"
    claude_code_only: true
    notes: "Declares itself a Claude Code skill and references TodoWrite and the Task tool; needs adaptation for codex/opencode/cursor."

  - name: ayghri/i-have-adhd
    # upstream := https://github.com/ayghri/i-have-adhd
    # also listed on https://skills.sh/ayghri/i-have-adhd
    selection: [i-have-adhd]
    agents: [claude-code, codex, opencode, cursor]
    verified_commit: 2d19ad205eb1d85fc9c3968bdeba4c2116518685
    verified_at: "2026-08-08"
    claude_code_only: false
    notes: "Manually invoked (/i-have-adhd). Shapes output for ADHD readers: lead with action, number steps, suppress tangents, restate state."

  - name: juliusbrussee/caveman
    # upstream := https://github.com/juliusbrussee/caveman
    # also listed on https://skills.sh/juliusbrussee/caveman/caveman
    selection: [caveman]
    agents: [claude-code, codex, opencode, cursor]
    verified_commit: 11ddc0c9813c8f75365cd5be2f753df08712f154
    verified_at: "2026-08-08"
    claude_code_only: false
    notes: "Ultra-compressed communication mode (65% token reduction). Supports lite/full/ultra/wenyan intensity levels. Note: upstream allows auto-triggering when token efficiency is requested — this can conflict with i-have-adhd (both are persistent formatting modes); only one should be active at a time."

maintained_locally:
  # 11 public skills installed from S1933/skills itself (self-hosted source).
  - source: S1933/skills
    selection: [
        adapter-pattern,
        atomic-file-write,
        binary-distribution,
        codex,
        embedded-fixtures,
        go-cli-conventions,
        golden-file-testing,
        repository-reconnaissance,
        review-scope,
        [REMOVED-INTERNAL-SKILL],
        schema-validation,
      ]
    agents: [claude-code, codex, opencode, cursor]
    verified_commit: null
    verified_at: null
    claude_code_only: false
    notes: "Maintained in this repository; see skills-manifest.yaml as source of truth."

# Install policy
policy:
  # Replay the four `add` commands in docs/migration-npx.md rather than a bare
  # `update --global`, so only the declared selection is refreshed.
  update: "replay-declared-add"
  # Record verified_commit/verified_at here after each review of upstream.
  pinning: "optional-but-recommended"
