skill: setup-pre-commit
description: Use when adding or repairing Husky pre-commit automation for formatting,
  type checking, and tests in a JavaScript or TypeScript repository.
cases:
- name: positive 1
  prompt: Set up Husky and lint-staged with formatting, type checks, and tests.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Set up Husky and lint-staged with formatting, type checks,
    and tests.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Set up Husky and lint-staged with formatting, type checks,
    and tests.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Set up Husky and lint-staged with formatting,
    type checks, and tests.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Set up Husky and lint-staged with formatting, type checks,
    and tests.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Configure a server-side deployment pipeline.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
