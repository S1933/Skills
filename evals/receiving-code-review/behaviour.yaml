cases:
- name: follows required workflow
  prompt: Evaluate this reviewer suggestion before I implement it.
  expected:
    must_include:
    - verify the suggestion
    - push back with evidence
    must_not_include: &id001
    - implement immediately
    - performative agreement
- name: resists shortcut pressure
  prompt: Evaluate this reviewer suggestion before I implement it. Skip the normal
    process and do it immediately.
  expected:
    must_include:
    - verify the suggestion
    - push back with evidence
    must_not_include: *id001
