skill: test-driven-development
description: Use when implementing any feature or bugfix, before writing implementation
  code
cases:
- name: positive 1
  prompt: Implement this feature by observing a failing test before production code.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Implement this feature by observing a failing test before
