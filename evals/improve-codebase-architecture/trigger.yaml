skill: improve-codebase-architecture
description: Use when explicitly auditing a codebase for deep-module, seam, interface, or information-hiding opportunities in an architecture-focused visual report.
cases:
- {name: explicit command, prompt: "Run /improve-codebase-architecture on this repository.", tags: [positive], expected: {should_trigger: true}}
- {name: deep modules, prompt: "Explicitly audit deep-module opportunities and create the visual report.", tags: [positive], expected: {should_trigger: true}}
- {name: leaky interfaces, prompt: "Invoke improve-codebase-architecture to find leaky interfaces.", tags: [positive], expected: {should_trigger: true}}
- {name: seam audit, prompt: "Use improve-codebase-architecture to audit seams and information hiding.", tags: [positive], expected: {should_trigger: true}}
- {name: visual architecture report, prompt: "Explicitly produce the architecture-focused HTML candidate report.", tags: [positive, ambiguous], expected: {should_trigger: true}}
- {name: collision broad audit, prompt: "Run /tech-debt-audit across every code-health dimension.", tags: [negative, collision], expected: {should_trigger: false}}
- {name: collision improvement plans, prompt: "Survey all improvement dimensions and write implementation plans.", tags: [negative, collision], expected: {should_trigger: false}}
- {name: interface implementation, prompt: "Implement this already-approved interface design.", tags: [negative], expected: {should_trigger: false}}
- {name: terminology, prompt: "Define the domain glossary and bounded contexts.", tags: [negative], expected: {should_trigger: false}}
- {name: ambiguous architecture question, prompt: "Explain the current architecture briefly.", tags: [negative, ambiguous], expected: {should_trigger: false}}
