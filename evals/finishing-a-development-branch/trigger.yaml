skill: finishing-a-development-branch
description: Use when implementation and verification are complete and the branch
  needs an explicit merge, pull-request, retention, or cleanup decision.
cases:
- name: positive 1
  prompt: All work is verified; help me decide whether to merge, open a PR, or keep
    the branch.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: All work is verified; help me decide whether to merge, open
    a PR, or keep the branch.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, All work is verified; help me decide whether to merge,
    open a PR, or keep the branch.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, All work is verified; help me decide whether to
    merge, open a PR, or keep the branch.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to All work is verified; help me decide whether to merge,
    open a PR, or keep the branch.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Create an isolated worktree before implementation begins.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
