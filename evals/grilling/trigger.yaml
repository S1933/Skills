skill: grilling
description: Use when a plan or design needs a rigorous one-question-at-a-time stress
  test before implementation.
cases:
- name: positive 1
  prompt: Stress-test this design one question at a time before we build it.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Stress-test this design one question at a time before we build
    it.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Stress-test this design one question at a time before
    we build it.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Stress-test this design one question at a time
    before we build it.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Stress-test this design one question at a time before
    we build it.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: The design is approved; write the implementation plan.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
