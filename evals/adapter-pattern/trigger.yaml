skill: adapter-pattern
description: Use when one domain model must interoperate with multiple external APIs,
  file formats, providers, CLIs, storage engines, or versioned protocols without leaking
  vendor details into core logic.
cases:
- name: positive 1
  prompt: Add a second cloud provider without leaking its API types into the domain.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Add a second cloud provider without leaking its API types
    into the domain.'
