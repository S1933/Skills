skill: repository-reconnaissance
description: Use when an audit, review, plan, or unfamiliar repository task needs
  an evidence-based map of instructions, architecture, commands, history, and inspectable
  scope before conclusions are drawn.
cases:
- name: positive 1
  prompt: Map this unfamiliar repository's instructions, architecture, commands, and
    scope before the audit.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Map this unfamiliar repository''s instructions, architecture,
    commands, and scope before the audit.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Map this unfamiliar repository's instructions, architecture,
    commands, and scope before the audit.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Map this unfamiliar repository's instructions,
    architecture, commands, and scope before the audit.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Map this unfamiliar repository's instructions, architecture,
    commands, and scope before the audit.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Implement a well-specified one-line change in a familiar repository.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
