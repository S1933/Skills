skill: golden-file-testing
description: Use when testing generated text, configuration, serialization, templates,
  compiler output, or other stable artifacts whose complete shape matters more than
  isolated fields.
cases:
- name: positive 1
  prompt: Test this generated configuration byte-for-byte with reviewed fixtures.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Test this generated configuration byte-for-byte with reviewed
    fixtures.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Test this generated configuration byte-for-byte with
    reviewed fixtures.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Test this generated configuration byte-for-byte
    with reviewed fixtures.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Test this generated configuration byte-for-byte with
    reviewed fixtures.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Unit test a small arithmetic function with scalar assertions.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
