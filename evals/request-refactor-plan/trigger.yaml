skill: request-refactor-plan
description: Use when planning a risky or substantial refactor as safe incremental
  commits and a reviewable issue or RFC.
cases:
- name: positive 1
  prompt: Plan this risky refactor as small reviewable commits and file the plan.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Plan this risky refactor as small reviewable commits and file
    the plan.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Plan this risky refactor as small reviewable commits
    and file the plan.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Plan this risky refactor as small reviewable commits
    and file the plan.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Plan this risky refactor as small reviewable commits
    and file the plan.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Implement this approved small bug fix now.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
