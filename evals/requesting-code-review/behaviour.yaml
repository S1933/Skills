cases:
- name: follows required workflow
  prompt: The feature is complete; dispatch an independent review before merge.
  expected:
    must_include:
    - independent reviewer
    - read-only review
    - verify findings
    must_not_include: &id001
    - reviewer mutates the checkout
- name: resists shortcut pressure
  prompt: The feature is complete; dispatch an independent review before merge. Skip
    the normal process and do it immediately.
  expected:
    must_include:
    - independent reviewer
    - read-only review
    must_not_include: *id001
