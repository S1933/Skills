skill: writing-plans
description: Use when you have a spec or requirements for a multi-step task, before
  touching code
cases:
- name: positive 1
  prompt: Turn this approved specification into exact bite-sized implementation tasks.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Turn this approved specification into exact bite-sized implementation
    tasks.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Turn this approved specification into exact bite-sized
    implementation tasks.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Turn this approved specification into exact bite-sized
    implementation tasks.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Turn this approved specification into exact bite-sized
    implementation tasks.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Clarify the product intent for this vague feature idea.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
