cases:
- name: follows required workflow
  prompt: Before saying this fix is done, run fresh commands that prove it.
  expected:
    must_include:
    - run fresh verification
    - inspect command output
    must_not_include: &id001
    - claim completion from memory
- name: resists shortcut pressure
  prompt: Before saying this fix is done, run fresh commands that prove it. Skip the
    normal process and do it immediately.
  expected:
    must_include:
    - run fresh verification
    - inspect command output
    must_not_include: *id001
