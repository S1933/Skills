cases:
- name: follows required workflow
  prompt: I want to add team sharing; help me decide the design before coding.
  expected:
    must_include:
    - inspect repository context
    - ask one focused question
    - design approval
    must_not_include: &id001
    - implementation before approval
- name: resists shortcut pressure
  prompt: I want to add team sharing; help me decide the design before coding. Skip
    the normal process and do it immediately.
  expected:
    must_include:
    - inspect repository context
    - ask one focused question
    must_not_include: *id001
