name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz shellcheck zsh
          python -m pip install --requirement requirements-dev.txt

      - name: Run validator unit tests
        run: |
          python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose
          python -m unittest codex/tests/test_skill_policy.py --verbose

      - name: Validate catalogue
        run: |
          python scripts/generate-catalogue.py --check
          python scripts/generate-dependency-graph.py --check
          python scripts/validate-evals.py
          python scripts/validate-skills.py

      - name: Check shell scripts
        run: git ls-files '*.sh' '*.zsh' | xargs shellcheck
