name: Verify upstreams

# Every registry skill must resolve to a real upstream SKILL.md, matched by
# frontmatter `name` (not directory name), discovered via the recursive git
# tree — no upstream layout assumed. Runs on registry changes AND weekly, to
# catch silent upstream removals. Drift (content changes) is handled by the
# separate check-upstream-drift workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - registry.json
      - scripts/verify-upstreams.py
      - .github/workflows/verify-upstreams.yml
  push:
    branches: [main]
    paths:
      - registry.json
      - scripts/verify-upstreams.py
      - .github/workflows/verify-upstreams.yml
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: All skills reachable upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify every skill still exists upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify-upstreams.py registry.json