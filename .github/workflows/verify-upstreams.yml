name: Verify upstreams

# Weekly scheduled check that every (owner, repo) still publishes the
# referenced skill. Catches silent upstream removals before they break
# ./install.sh in CI.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: All skills reachable upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every skill still exists upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, base64, urllib.request, urllib.error

          with open('registry.json') as f:
              reg = json.load(f)

          GH_TOKEN = os.environ.get('GH_TOKEN', '')
          def api_get(url):
              headers = {
                  "User-Agent": "s1933-skills-registry/1.0",
                  "Accept": "application/vnd.github+json",
              }
              if GH_TOKEN:
                  headers["Authorization"] = f"Bearer {GH_TOKEN}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, str(e).encode()

          def skill_exists(owner, repo, name):
              # Strategy 1: GitHub contents API (works with token, also rate-limited without)
              for base in (
                  f"https://api.github.com/repos/{owner}/{repo}/contents/skills/{name}/SKILL.md",
                  f"https://api.github.com/repos/{owner}/{repo}/contents/skills/engineering/{name}/SKILL.md",
                  f"https://api.github.com/repos/{owner}/{repo}/contents/skills/productivity/{name}/SKILL.md",
                  f"https://api.github.com/repos/{owner}/{repo}/contents/skills/in-progress/{name}/SKILL.md",
                  f"https://api.github.com/repos/{owner}/{repo}/contents/skills/misc/{name}/SKILL.md",
                  f"https://api.github.com/repos/{owner}/{repo}/contents/{name}/SKILL.md",
              ):
                  status, _ = api_get(base)
                  if status == 200:
                      return True
                  if status == 404:
                      continue
                  if status == 403:
                      # Rate-limited — bail out, fall through to raw
                      break
              # Strategy 2: raw.githubusercontent fallback (much higher rate limit, no auth needed)
              for path in (
                  f"skills/{name}/SKILL.md",
                  f"skills/engineering/{name}/SKILL.md",
                  f"skills/productivity/{name}/SKILL.md",
                  f"skills/in-progress/{name}/SKILL.md",
                  f"skills/misc/{name}/SKILL.md",
                  f"{name}/SKILL.md",
              ):
                  url = f"https://raw.githubusercontent.com/{owner}/{repo}/main/{path}"
                  status, _ = api_get(url)
                  if status == 200:
                      return True
              # Strategy 3: try master branch
              for path in (
                  f"skills/{name}/SKILL.md",
                  f"{name}/SKILL.md",
              ):
                  url = f"https://raw.githubusercontent.com/{owner}/{repo}/master/{path}"
                  status, _ = api_get(url)
                  if status == 200:
                      return True
              return False

          missing = []
          checked = 0
          for s in reg['skills']:
              owner, repo, name = s['owner'], s['repo'], s['name']
              if owner == 'TBD' or repo == 'TBD':
                  continue
              checked += 1
              if not skill_exists(owner, repo, name):
                  missing.append((name, f"{owner}/{repo}"))

          print(f"Checked {checked} skills across upstream registries.")
          if missing:
              print(f"\n{len(missing)} skill(s) no longer reachable upstream:")
              for name, src in missing:
                  print(f"  ✗ {name:<32} ({src})")
              sys.exit(1)
          print("✓ All upstreams reachable.")
          PYEOF
